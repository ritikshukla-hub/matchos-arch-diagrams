<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <defs>
    <style type="text/css"><![CDATA[
      .brand { font: 600 12px Helvetica, Arial, sans-serif; fill: #6B7280; letter-spacing: 0.08em; }
      .title { font: 700 26px Helvetica, Arial, sans-serif; fill: #111827; }
      .sub { font: 400 13px Helvetica, Arial, sans-serif; fill: #6B7280; }
      .vpc { font: 700 15px Helvetica, Arial, sans-serif; fill: #1D4ED8; }
      .zone { font: 700 14px Helvetica, Arial, sans-serif; fill: #2563EB; }
      .sec { font: 700 13px Helvetica, Arial, sans-serif; fill: #1F2937; }
      .lab { font: 600 13px Helvetica, Arial, sans-serif; fill: #111827; }
      .sm { font: 400 11px Helvetica, Arial, sans-serif; fill: #6B7280; }
      .w { font: 700 12px Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .wsm { font: 400 10px Helvetica, Arial, sans-serif; fill: #E5E7EB; }
      .flow { font: 500 10px Helvetica, Arial, sans-serif; fill: #6B7280; }
    ]]></style>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <filter id="card" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="2200" height="1400" fill="#FFFFFF"/>

  <text x="48" y="36" class="brand">HEALTH MONITOR NETWORK  |  PREPARED BY R SYSTEMS INTERNATIONAL</text>
  <text x="48" y="72" class="title">MatchOS / ListMatch on Google Cloud - physical deployment</text>
  <text x="48" y="96" class="sub">VPC and zone layout - us-central1  |  Confidential  |  v2.0</text>

  <g transform="translate(1180, 40)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#2563EB" stroke-width="2.5"/>
    <text x="36" y="12" class="sm">HTTPS / API</text>
    <line x1="130" y1="8" x2="158" y2="8" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="166" y="12" class="sm">NAT egress (AWS)</text>
    <line x1="310" y1="8" x2="338" y2="8" stroke="#059669" stroke-width="2.5"/>
    <text x="346" y="12" class="sm">Private SQL</text>
    <rect x="450" y="0" width="14" height="14" rx="2" fill="none" stroke="#9CA3AF" stroke-dasharray="3 2"/>
    <text x="470" y="12" class="sm">Prod reserved</text>
  </g>

  <!-- Clients -->
  <g transform="translate(48, 300)" filter="url(#card)">
    <rect width="160" height="120" rx="12" fill="#111827"/>
    <text x="80" y="36" text-anchor="middle" class="w">Clients</text>
    <text x="80" y="62" text-anchor="middle" class="wsm">Developers</text>
    <text x="80" y="80" text-anchor="middle" class="wsm">Testers</text>
    <text x="80" y="98" text-anchor="middle" class="wsm">Internal users</text>
  </g>
  <path d="M218 360 H 290" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="235" y="346" class="flow">HTTPS</text>

  <!-- VPC -->
  <g transform="translate(300, 120)">
    <rect width="1852" height="1160" rx="18" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/>
    <text x="24" y="34" class="vpc">VPC - MatchOS  |  us-central1 (shared RSI VPC with SAM in non-prod)</text>
    <text x="1828" y="34" text-anchor="end" class="sm">Dev/Staging: hmn-rsi-*  |  Prod: rsi-listmatch-prod (planned)</text>

    <!-- Zone A -->
    <g transform="translate(24, 56)">
      <rect width="880" height="1060" rx="14" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="10 6"/>
      <text x="20" y="30" class="zone">Zone us-central1-a</text>

      <g transform="translate(20, 48)" filter="url(#card)">
        <rect width="400" height="960" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.75"/>
        <text x="20" y="32" class="sec">Public / compute path</text>
        <text x="20" y="50" class="sm">Cloud Run entry (no API Gateway)</text>

        <g transform="translate(24, 70)">
          <rect width="352" height="88" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="16" y="32" class="lab">Cloud Run</text>
          <text x="16" y="54" class="sm">listmatch-app</text>
          <text x="16" y="72" class="sm">UI / API  |  public invoker (non-prod)</text>
        </g>
        <line x1="200" y1="158" x2="200" y2="182" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

        <g transform="translate(24, 182)">
          <rect width="352" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="16" y="30" class="lab">Cloud Run</text>
          <text x="16" y="52" class="sm">orchestrator</text>
          <text x="16" y="70" class="sm">Match pipeline  |  X-API-Key</text>
        </g>
        <line x1="200" y1="262" x2="200" y2="286" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

        <g transform="translate(24, 286)">
          <rect width="352" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="16" y="30" class="lab">Cloud Run</text>
          <text x="16" y="52" class="sm">langfuse</text>
          <text x="16" y="70" class="sm">Traces / observability</text>
        </g>
        <line x1="200" y1="366" x2="200" y2="390" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>

        <g transform="translate(24, 390)">
          <rect width="352" height="100" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
          <text x="16" y="32" class="lab">Direct VPC egress</text>
          <text x="16" y="54" class="sm">Private subnet rsi-*-private</text>
          <text x="16" y="72" class="sm">vpc-egress = all-traffic</text>
          <text x="16" y="90" class="sm">Dev 10.10.2.0/24  |  Stg 10.20.2.0/24</text>
        </g>
        <line x1="200" y1="490" x2="200" y2="514" stroke="#D97706" stroke-width="2" marker-end="url(#arrA)"/>

        <g transform="translate(24, 514)">
          <rect width="352" height="100" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
          <text x="16" y="32" class="lab">NAT VM (static IP)</text>
          <text x="16" y="54" class="sm">matchos-*-nat</text>
          <text x="16" y="72" class="sm">Dev 34.67.129.122</text>
          <text x="16" y="90" class="sm">Staging 34.55.162.49</text>
        </g>

        <g transform="translate(24, 640)">
          <rect width="352" height="280" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
          <text x="16" y="28" class="sec">Primary flows</text>
          <text x="16" y="56" class="sm">1. Client -&gt; listmatch-app (HTTPS)</text>
          <text x="16" y="80" class="sm">2. App -&gt; AWS RDS (allowlisted NAT IP)</text>
          <text x="16" y="104" class="sm">3. Upload -&gt; S3 via NAT egress</text>
          <text x="16" y="128" class="sm">4. Column map -&gt; Lambda via NAT</text>
          <text x="16" y="152" class="sm">5. Pipeline -&gt; orchestrator -&gt; Claude</text>
          <text x="16" y="176" class="sm">6. Traces -&gt; Langfuse -&gt; Cloud SQL</text>
          <text x="16" y="212" class="sec">Notes</text>
          <text x="16" y="236" class="sm">No Site-to-Site VPN (decommissioned)</text>
          <text x="16" y="256" class="sm">No API Gateway in non-prod</text>
          <text x="16" y="276" class="sm">Cohosts SAM on shared RSI projects</text>
        </g>
      </g>

      <!-- Center managed / platform in zone A right -->
      <g transform="translate(440, 48)">
        <text x="0" y="24" class="sec">GCP platform</text>
        <g transform="translate(20, 48)" filter="url(#card)">
          <rect width="200" height="140" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
          <text x="100" y="40" text-anchor="middle" class="lab">Cloud SQL</text>
          <text x="100" y="64" text-anchor="middle" class="sm">assetsor-pg</text>
          <text x="100" y="88" text-anchor="middle" class="sm">Shared with SAM</text>
          <text x="100" y="112" text-anchor="middle" class="sm">Langfuse / AI obs</text>
          <text x="100" y="130" text-anchor="middle" class="sm">Private IP</text>
        </g>
        <g transform="translate(20, 220)" filter="url(#card)">
          <rect width="200" height="160" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
          <text x="100" y="36" text-anchor="middle" class="lab">Platform</text>
          <text x="100" y="64" text-anchor="middle" class="sm">Secret Manager</text>
          <text x="100" y="88" text-anchor="middle" class="sm">Artifact Registry</text>
          <text x="100" y="112" text-anchor="middle" class="sm">Cloud Build + WIF</text>
          <text x="100" y="136" text-anchor="middle" class="sm">Monitoring</text>
        </g>
        <g transform="translate(20, 420)" filter="url(#card)">
          <rect width="200" height="120" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
          <text x="100" y="40" text-anchor="middle" class="lab">Vertex AI</text>
          <text x="100" y="64" text-anchor="middle" class="sm">Embeddings</text>
          <text x="100" y="88" text-anchor="middle" class="sm">+ Claude (external)</text>
        </g>
      </g>
    </g>

    <!-- Zone B AWS + private -->
    <g transform="translate(940, 56)">
      <rect width="888" height="1060" rx="14" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="10 6"/>
      <text x="20" y="30" class="zone">Zone us-central1-b / AWS edge</text>

      <g transform="translate(20, 48)" filter="url(#card)">
        <rect width="848" height="720" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.75"/>
        <text x="24" y="36" class="sec">AWS edge (HMN-owned)</text>
        <text x="24" y="56" class="sm">Reached via NAT allowlisted IPs - no Site-to-Site VPN</text>

        <g transform="translate(24, 80)">
          <rect width="800" height="100" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="32" class="lab">AWS RDS SQL Server</text>
          <text x="20" y="56" class="sm">ListMatch SoR  |  ListMatch_Dev / ListMatch_Staging</text>
          <text x="20" y="80" class="sm">Public endpoint; source IP = NAT VM (TCP 1433 allowlisted)</text>
        </g>
        <g transform="translate(24, 200)">
          <rect width="800" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="32" class="lab">AWS S3</text>
          <text x="20" y="56" class="sm">hm-listmatch-dev-data / hm-listmatch-stage-data</text>
          <text x="20" y="76" class="sm">Uploads + Lambda deployment zips (via NAT egress)</text>
        </g>
        <g transform="translate(24, 310)">
          <rect width="800" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="32" class="lab">AWS Lambda</text>
          <text x="20" y="56" class="sm">hm-listmatch-*-report-generator (us-east-1)</text>
          <text x="20" y="76" class="sm">Column mapping / report generation</text>
        </g>
        <g transform="translate(24, 420)">
          <rect width="800" height="120" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
          <text x="20" y="32" class="lab">Private data note (GCP)</text>
          <text x="20" y="56" class="sm">Langfuse Postgres DBs live on shared Cloud SQL assetsor-pg</text>
          <text x="20" y="80" class="sm">Not the ListMatch transactional SoR (that is AWS RDS)</text>
          <text x="20" y="104" class="sm">cost-center=shared-data with SAM AssetSOR DBs</text>
        </g>
        <g transform="translate(24, 560)">
          <rect width="800" height="120" rx="10" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
          <text x="20" y="32" class="lab">Prod isolation (reserved / not provisioned)</text>
          <text x="20" y="56" class="sm">Planned project: rsi-listmatch-prod</text>
          <text x="20" y="80" class="sm">Dedicated VPC (e.g. 10.30.0.0/16) - no SAM co-tenancy</text>
          <text x="20" y="104" class="sm">SAM prod remains rsi-sam-prod (separate)</text>
        </g>
      </g>

      <g transform="translate(20, 800)" filter="url(#card)">
        <rect width="848" height="160" rx="12" fill="#111827"/>
        <text x="24" y="40" class="w">CI / Ops</text>
        <text x="24" y="72" class="wsm">GitHub Actions + WIF (github-pool) - keyless deploy</text>
        <text x="24" y="96" class="wsm">Terraform: matchos-infra (envs/dev, envs/staging)</text>
        <text x="24" y="120" class="wsm">TF state: gs://hmn-rsi-*-matchos-terraform-state</text>
        <text x="24" y="144" class="wsm">Labels: cost-center=rsi-matchos</text>
      </g>
    </g>

    <!-- Cross arrows -->
    <path d="M444 640 C 560 640, 700 300, 780 220" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="560" y="400" class="flow">Langfuse -&gt; Cloud SQL</text>
    <path d="M444 600 C 700 600, 900 280, 980 220" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
    <text x="700" y="520" class="flow">NAT -&gt; AWS S3 / Lambda / RDS</text>
  </g>

  <rect y="1348" width="2200" height="52" fill="#111827"/>
  <text x="48" y="1380" class="wsm">MatchOS / ListMatch  |  Health Monitor Network  |  R Systems International  |  Confidential  |  No VPN - NAT allowlist to AWS</text>
  <text x="2152" y="1380" text-anchor="end" class="wsm">Figure 1</text>
</svg>
