<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <!-- Editable schematic companion. Primary client visual is the VPC/zone PNG poster. -->
  <defs>
    <style type="text/css"><![CDATA[
      .brand { font: 600 12px Helvetica, Arial, sans-serif; fill: #6B7280; letter-spacing: 0.08em; }
      .title { font: 700 26px Helvetica, Arial, sans-serif; fill: #111827; }
      .sub { font: 400 13px Helvetica, Arial, sans-serif; fill: #6B7280; }
      .vpc { font: 700 15px Helvetica, Arial, sans-serif; fill: #1D4ED8; }
      .zone { font: 700 14px Helvetica, Arial, sans-serif; fill: #2563EB; }
      .sec { font: 700 13px Helvetica, Arial, sans-serif; fill: #1F2937; }
      .lab { font: 600 13px Helvetica, Arial, sans-serif; fill: #111827; }
      .sm { font: 400 11px Helvetica, Arial, sans-serif; fill: #6B7280; }
      .w { font: 700 12px Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .wsm { font: 400 10px Helvetica, Arial, sans-serif; fill: #E5E7EB; }
      .flow { font: 500 10px Helvetica, Arial, sans-serif; fill: #6B7280; }
    ]]></style>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <filter id="card" x="-3%" y="-3%" width="106%" height="112%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#111827" flood-opacity="0.08"/></filter>
  </defs>

  <rect width="2200" height="1400" fill="#FFFFFF"/>
  <text x="48" y="36" class="brand">HEALTH MONITOR NETWORK  |  PREPARED BY R SYSTEMS INTERNATIONAL</text>
  <text x="48" y="72" class="title">MatchOS / ListMatch on Google Cloud - physical deployment</text>
  <text x="48" y="96" class="sub">VPC and zone layout - us-central1  |  Confidential  |  v2.1  |  All AWS via NAT</text>

  <g transform="translate(1180, 40)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#2563EB" stroke-width="2.5"/>
    <text x="36" y="12" class="sm">HTTPS / service call</text>
    <line x1="170" y1="8" x2="198" y2="8" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="206" y="12" class="sm">NAT egress to AWS</text>
    <line x1="360" y1="8" x2="388" y2="8" stroke="#059669" stroke-width="2.5"/>
    <text x="396" y="12" class="sm">Private IP Cloud SQL</text>
  </g>

  <g transform="translate(48, 360)" filter="url(#card)">
    <rect width="160" height="120" rx="12" fill="#111827"/>
    <text x="80" y="40" text-anchor="middle" class="w">Clients</text>
    <text x="80" y="68" text-anchor="middle" class="wsm">Developers / Testers</text>
    <text x="80" y="90" text-anchor="middle" class="wsm">Internal users</text>
  </g>
  <path d="M208 420 H 300" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="230" y="406" class="flow">HTTPS</text>

  <g transform="translate(300, 130)">
    <rect width="1852" height="1120" rx="18" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/>
    <text x="24" y="34" class="vpc">VPC - MatchOS  |  us-central1 (shared RSI with SAM in non-prod)</text>

    <!-- Zone A -->
    <g transform="translate(24, 56)">
      <rect width="780" height="1020" rx="14" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="10 6"/>
      <text x="20" y="30" class="zone">Zone us-central1-a  |  Public / compute path</text>

      <g transform="translate(40, 60)" filter="url(#card)">
        <rect width="420" height="900" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
        <g transform="translate(30, 30)">
          <rect width="360" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="18" y="34" class="lab">Cloud Run  |  listmatch-app</text>
          <text x="18" y="58" class="sm">UI / API</text>
        </g>
        <line x1="210" y1="120" x2="210" y2="150" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
        <g transform="translate(30, 150)">
          <rect width="360" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="18" y="32" class="lab">Cloud Run  |  orchestrator</text>
          <text x="18" y="56" class="sm">Match pipeline</text>
        </g>
        <line x1="210" y1="230" x2="210" y2="260" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>
        <g transform="translate(30, 260)">
          <rect width="360" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="18" y="32" class="lab">Cloud Run  |  langfuse</text>
          <text x="18" y="56" class="sm">Traces / observability</text>
        </g>
        <line x1="210" y1="340" x2="210" y2="380" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrA)"/>
        <g transform="translate(30, 380)">
          <rect width="360" height="100" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
          <text x="18" y="34" class="lab">Direct VPC egress</text>
          <text x="18" y="58" class="sm">rsi-*-private  |  all-traffic</text>
          <text x="18" y="80" class="sm">Dev 10.10.2.0/24  |  Stg 10.20.2.0/24</text>
        </g>
        <line x1="210" y1="480" x2="210" y2="520" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrA)"/>
        <g transform="translate(30, 520)">
          <rect width="360" height="120" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
          <text x="18" y="34" class="lab">NAT VM  |  sole AWS egress</text>
          <text x="18" y="60" class="sm">matchos-*-nat</text>
          <text x="18" y="84" class="sm">Dev 34.67.129.122</text>
          <text x="18" y="106" class="sm">Staging 34.55.162.49</text>
        </g>
      </g>
    </g>

    <!-- Zone B -->
    <g transform="translate(860, 56)">
      <rect width="960" height="1020" rx="14" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="10 6"/>
      <text x="20" y="30" class="zone">Zone us-central1-b  |  AWS edge + private data</text>

      <g transform="translate(40, 60)" filter="url(#card)">
        <rect width="880" height="700" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
        <text x="24" y="36" class="sec">AWS (via NAT allowlist only)</text>

        <g transform="translate(24, 60)">
          <rect width="832" height="100" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="36" class="lab">AWS RDS SQL Server</text>
          <text x="20" y="64" class="sm">ListMatch SoR  |  ListMatch_Dev / Staging</text>
        </g>
        <g transform="translate(24, 180)">
          <rect width="832" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="34" class="lab">AWS S3</text>
          <text x="20" y="60" class="sm">Uploads + Lambda zips</text>
        </g>
        <g transform="translate(24, 290)">
          <rect width="832" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="34" class="lab">AWS Lambda</text>
          <text x="20" y="60" class="sm">Column mapping / report-generator</text>
        </g>
        <g transform="translate(24, 410)">
          <rect width="832" height="100" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
          <text x="20" y="36" class="lab">Shared Cloud SQL  |  assetsor-pg</text>
          <text x="20" y="64" class="sm">Langfuse / AI obs  |  Private IP (GCP only)</text>
        </g>
        <g transform="translate(24, 540)">
          <rect width="832" height="100" rx="10" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
          <text x="20" y="36" class="lab">Prod reserved</text>
          <text x="20" y="64" class="sm">rsi-listmatch-prod (not provisioned)</text>
        </g>
      </g>
    </g>

    <!-- Amber: NAT only → AWS -->
    <path d="M484 730 C 700 730, 900 220, 940 220" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
    <path d="M484 750 C 720 750, 920 330, 940 330" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
    <path d="M484 770 C 740 770, 940 440, 940 440" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
    <text x="620" y="700" class="flow">all AWS via NAT</text>

    <!-- Green: langfuse → Cloud SQL -->
    <path d="M484 400 C 700 400, 900 560, 940 560" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="680" y="480" class="flow">private IP (GCP)</text>
  </g>

  <rect y="1348" width="2200" height="52" fill="#111827"/>
  <text x="48" y="1380" class="wsm">MatchOS / ListMatch  |  Health Monitor Network  |  R Systems  |  Confidential  |  v2.1  |  No VPN - all AWS via NAT VM</text>
  <text x="2152" y="1380" text-anchor="end" class="wsm">Figure 1</text>
</svg>
