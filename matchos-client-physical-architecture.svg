<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <defs>
    <style type="text/css"><![CDATA[
      .brand { font: 600 12px Helvetica, Arial, sans-serif; fill: #6B7280; letter-spacing: 0.08em; }
      .title { font: 700 26px Helvetica, Arial, sans-serif; fill: #111827; }
      .sub { font: 400 13px Helvetica, Arial, sans-serif; fill: #6B7280; }
      .vpc { font: 700 15px Helvetica, Arial, sans-serif; fill: #1D4ED8; }
      .zone { font: 700 14px Helvetica, Arial, sans-serif; fill: #2563EB; }
      .sec { font: 700 13px Helvetica, Arial, sans-serif; fill: #1F2937; }
      .lab { font: 600 13px Helvetica, Arial, sans-serif; fill: #111827; }
      .sm { font: 400 11px Helvetica, Arial, sans-serif; fill: #6B7280; }
      .w { font: 700 12px Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .wsm { font: 400 10px Helvetica, Arial, sans-serif; fill: #E5E7EB; }
      .flow { font: 600 11px Helvetica, Arial, sans-serif; fill: #6B7280; }
      .flowA { font: 600 11px Helvetica, Arial, sans-serif; fill: #B45309; }
      .flowG { font: 600 11px Helvetica, Arial, sans-serif; fill: #047857; }
    ]]></style>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <filter id="card" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="2200" height="1400" fill="#FFFFFF"/>

  <text x="48" y="36" class="brand">HEALTH MONITOR NETWORK  |  PREPARED BY R SYSTEMS INTERNATIONAL</text>
  <text x="48" y="72" class="title">MatchOS / ListMatch on Google Cloud - physical deployment</text>
  <text x="48" y="96" class="sub">VPC and zone layout - us-central1  |  Confidential  |  v2.1  |  All GCP to AWS via NAT VM</text>

  <!-- Legend -->
  <g transform="translate(1180, 40)">
    <line x1="0" y1="8" x2="28" y2="8" stroke="#2563EB" stroke-width="2.5"/>
    <text x="36" y="12" class="sm">HTTPS / service call</text>
    <line x1="180" y1="8" x2="208" y2="8" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="216" y="12" class="sm">NAT egress to AWS (allowlisted)</text>
    <line x1="430" y1="8" x2="458" y2="8" stroke="#059669" stroke-width="2.5"/>
    <text x="466" y="12" class="sm">Private IP Cloud SQL (GCP only)</text>
  </g>

  <!-- Clients (single box) -->
  <g transform="translate(48, 380)" filter="url(#card)">
    <rect width="160" height="120" rx="12" fill="#111827"/>
    <text x="80" y="36" text-anchor="middle" class="w">Clients</text>
    <text x="80" y="62" text-anchor="middle" class="wsm">Developers</text>
    <text x="80" y="80" text-anchor="middle" class="wsm">Testers</text>
    <text x="80" y="98" text-anchor="middle" class="wsm">Internal users</text>
  </g>
  <path d="M208 440 H 300" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="230" y="426" class="flow">HTTPS</text>

  <!-- VPC -->
  <g transform="translate(300, 120)">
    <rect width="1852" height="1160" rx="18" fill="#F9FAFB" stroke="#6B7280" stroke-width="2"/>
    <text x="24" y="34" class="vpc">VPC - MatchOS  |  us-central1 (shared RSI VPC with SAM in non-prod)</text>
    <text x="1828" y="34" text-anchor="end" class="sm">Dev/Staging: hmn-rsi-*  |  Prod: rsi-listmatch-prod (planned)</text>

    <!-- Zone A: compute + egress path -->
    <g transform="translate(24, 56)">
      <rect width="720" height="1060" rx="14" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="10 6"/>
      <text x="20" y="30" class="zone">Zone us-central1-a  |  Public / compute path</text>

      <g transform="translate(20, 48)" filter="url(#card)">
        <rect width="680" height="980" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.75"/>
        <text x="20" y="32" class="sec">Cloud Run entry (no API Gateway)</text>
        <text x="20" y="52" class="sm">Direct VPC egress = all-traffic  -  AWS only via NAT below</text>

        <!-- Cloud Run stack -->
        <g transform="translate(24, 70)">
          <rect width="360" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="16" y="28" class="lab">Cloud Run  |  listmatch-app</text>
          <text x="16" y="50" class="sm">UI / API  |  public invoker (non-prod)</text>
          <text x="16" y="68" class="sm">AWS calls only via NAT path below</text>
        </g>
        <line x1="204" y1="150" x2="204" y2="172" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

        <g transform="translate(24, 172)">
          <rect width="360" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="16" y="28" class="lab">Cloud Run  |  orchestrator</text>
          <text x="16" y="50" class="sm">Match pipeline  |  X-API-Key  |  Claude / Vertex</text>
        </g>
        <line x1="204" y1="244" x2="204" y2="266" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

        <g transform="translate(24, 266)">
          <rect width="360" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
          <text x="16" y="28" class="lab">Cloud Run  |  langfuse</text>
          <text x="16" y="50" class="sm">Traces / observability (Cloud SQL private IP)</text>
        </g>

        <!-- All Cloud Run services use Direct VPC egress (shown as stack note + down arrow, not a cross-zone line) -->
        <line x1="204" y1="338" x2="204" y2="368" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrA)"/>
        <text x="220" y="358" class="flowA">all Cloud Run</text>

        <g transform="translate(24, 368)">
          <rect width="400" height="88" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
          <text x="16" y="28" class="lab">Direct VPC egress</text>
          <text x="16" y="50" class="sm">Attached by listmatch-app + orchestrator + langfuse</text>
          <text x="16" y="70" class="sm">vpc-egress = all-traffic  |  Dev 10.10.2.0/24  |  Stg 10.20.2.0/24</text>
        </g>

        <!-- Split from Direct VPC: AWS-bound down to NAT; GCP SQL goes east (drawn later) -->
        <line x1="204" y1="456" x2="204" y2="500" stroke="#D97706" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrA)"/>
        <text x="220" y="484" class="flowA">AWS-bound only</text>

        <g transform="translate(24, 500)">
          <rect width="400" height="110" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
          <text x="16" y="30" class="lab">NAT VM (static IP)  -  sole AWS egress</text>
          <text x="16" y="52" class="sm">matchos-*-nat</text>
          <text x="16" y="72" class="sm">Dev 34.67.129.122  |  Staging 34.55.162.49</text>
          <text x="16" y="94" class="sm">Allowlisted on AWS RDS / S3 / Lambda</text>
        </g>

        <!-- Notes -->
        <g transform="translate(24, 640)">
          <rect width="400" height="300" rx="10" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1"/>
          <text x="16" y="28" class="sec">Correct path rules</text>
          <text x="16" y="56" class="sm">1. Clients -&gt; listmatch-app (HTTPS)</text>
          <text x="16" y="80" class="sm">2. Cloud Run -&gt; Direct VPC egress</text>
          <text x="16" y="104" class="sm">3. AWS RDS / S3 / Lambda ONLY via NAT VM</text>
          <text x="16" y="128" class="sm">4. Langfuse -&gt; Cloud SQL private IP (no NAT)</text>
          <text x="16" y="152" class="sm">5. No Cloud Run direct to any AWS service</text>
          <text x="16" y="188" class="sec">As-built notes</text>
          <text x="16" y="212" class="sm">Site-to-Site VPN decommissioned (Jun 2026)</text>
          <text x="16" y="236" class="sm">No API Gateway in non-prod</text>
          <text x="16" y="260" class="sm">Cohosts SAM on shared RSI projects</text>
          <text x="16" y="284" class="sm">ListMatch SoR = AWS RDS (not Cloud SQL)</text>
        </g>

        <!-- Platform + Cloud SQL stay in compute zone (GCP private path; never on AWS trunk) -->
        <g transform="translate(456, 70)" filter="url(#card)">
          <rect width="196" height="130" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
          <text x="98" y="28" text-anchor="middle" class="lab">Platform</text>
          <text x="98" y="54" text-anchor="middle" class="sm">Secret Manager</text>
          <text x="98" y="76" text-anchor="middle" class="sm">Artifact Registry</text>
          <text x="98" y="98" text-anchor="middle" class="sm">Cloud Build + WIF</text>
          <text x="98" y="120" text-anchor="middle" class="sm">Monitoring</text>
        </g>
        <g transform="translate(456, 220)" filter="url(#card)">
          <rect width="196" height="90" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
          <text x="98" y="30" text-anchor="middle" class="lab">Vertex / Claude</text>
          <text x="98" y="54" text-anchor="middle" class="sm">Embeddings + LLM</text>
          <text x="98" y="76" text-anchor="middle" class="sm">from orchestrator</text>
        </g>
        <g transform="translate(456, 330)" filter="url(#card)">
          <rect width="196" height="130" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
          <text x="98" y="28" text-anchor="middle" class="lab">Cloud SQL</text>
          <text x="98" y="52" text-anchor="middle" class="sm">assetsor-pg</text>
          <text x="98" y="74" text-anchor="middle" class="sm">Langfuse / AI obs</text>
          <text x="98" y="96" text-anchor="middle" class="sm">Private IP (GCP)</text>
          <text x="98" y="118" text-anchor="middle" class="sm">NOT ListMatch SoR</text>
        </g>
        <!-- Green stays inside Zone A: Direct VPC / langfuse → Cloud SQL -->
        <path d="M424 412 H 456" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
        <text x="300" y="400" class="flowG">private IP (no NAT)</text>
      </g>
    </g>

    <!-- Zone B: AWS edge ONLY (no GCP Cloud SQL here — avoids crossed arrows) -->
    <g transform="translate(780, 56)">
      <rect width="1048" height="1060" rx="14" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="10 6"/>
      <text x="20" y="30" class="zone">AWS edge (outside GCP private path)  |  reached only via NAT</text>

      <g transform="translate(20, 48)" filter="url(#card)">
        <rect width="1008" height="680" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.75"/>
        <text x="24" y="36" class="sec">AWS (HMN-owned)  -  all traffic sourced from NAT VM allowlisted IPs</text>
        <text x="24" y="56" class="sm">No Site-to-Site VPN  |  No arrows from Cloud Run directly to these boxes</text>

        <g id="aws-rds" transform="translate(40, 90)">
          <rect width="920" height="100" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="32" class="lab">AWS RDS SQL Server</text>
          <text x="20" y="56" class="sm">ListMatch SoR  |  ListMatch_Dev / ListMatch_Staging</text>
          <text x="20" y="80" class="sm">Public endpoint; source IP = NAT VM (TCP 1433 allowlisted)</text>
        </g>
        <g id="aws-s3" transform="translate(40, 220)">
          <rect width="920" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="30" class="lab">AWS S3</text>
          <text x="20" y="54" class="sm">hm-listmatch-dev-data / hm-listmatch-stage-data</text>
          <text x="20" y="76" class="sm">Uploads + Lambda deployment zips</text>
        </g>
        <g id="aws-lambda" transform="translate(40, 340)">
          <rect width="920" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
          <text x="20" y="30" class="lab">AWS Lambda</text>
          <text x="20" y="54" class="sm">hm-listmatch-*-report-generator (us-east-1)</text>
          <text x="20" y="76" class="sm">Column mapping / report generation</text>
        </g>

        <g transform="translate(40, 460)">
          <rect width="920" height="100" rx="10" fill="#F8FAFC" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"/>
          <text x="20" y="30" class="lab">Prod isolation (reserved / not provisioned)</text>
          <text x="20" y="54" class="sm">Planned project: rsi-listmatch-prod  |  dedicated VPC</text>
          <text x="20" y="78" class="sm">No SAM co-tenancy  |  SAM prod remains rsi-sam-prod</text>
        </g>

        <g transform="translate(40, 580)">
          <rect width="920" height="70" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
          <text x="20" y="28" class="lab">Ingress rule</text>
          <text x="20" y="52" class="sm">AWS security groups / bucket policies allowlist NAT IPs only (Dev 34.67.129.122 · Staging 34.55.162.49)</text>
        </g>
      </g>

      <g transform="translate(20, 760)" filter="url(#card)">
        <rect width="1008" height="140" rx="12" fill="#111827"/>
        <text x="24" y="36" class="w">CI / Ops</text>
        <text x="24" y="68" class="wsm">GitHub Actions + WIF (github-pool) - keyless deploy to Cloud Run</text>
        <text x="24" y="92" class="wsm">Terraform: matchos-infra  |  TF state: gs://hmn-rsi-*-matchos-terraform-state</text>
        <text x="24" y="116" class="wsm">Lambda zip publish also egresses via NAT -&gt; S3 (not direct from Cloud Run)</text>
      </g>
    </g>

    <!-- Amber ONLY: NAT → AWS. No green cross-zone path. -->
    <path d="M468 655 H 820" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="500" y="640" class="flowA">sole AWS egress trunk (from NAT VM)</text>
    <path d="M820 655 V 190 H 840" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
    <path d="M820 655 V 310 H 840" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
    <path d="M820 655 V 430 H 840" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrA)"/>
    <text x="700" y="220" class="flowA">NAT -&gt; RDS</text>
    <text x="700" y="340" class="flowA">NAT -&gt; S3</text>
    <text x="700" y="460" class="flowA">NAT -&gt; Lambda</text>
  </g>

  <rect y="1348" width="2200" height="52" fill="#111827"/>
  <text x="48" y="1380" class="wsm">MatchOS / ListMatch  |  Health Monitor Network  |  R Systems  |  Confidential  |  v2.1  |  No VPN - all AWS traffic via NAT VM</text>
  <text x="2152" y="1380" text-anchor="end" class="wsm">Figure 1</text>
</svg>
